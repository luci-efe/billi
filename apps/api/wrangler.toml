# Billi API Worker — Hono app behind Clerk.
#
# Deployment model: standalone Worker. In production we bind it to
# <domain>/api/* via a Cloudflare zone route so the frontend and API share
# the same origin (no CORS). Locally we hit it via the Vite proxy.

name = "billi-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set with `wrangler secret put <NAME>` in prod; `.dev.vars` in dev):
#   CLERK_SECRET_KEY
#   TURSO_DATABASE_URL
#   TURSO_AUTH_TOKEN
#   OPENROUTER_API_KEY

# [[routes]]
# pattern = "billi.example.com/api/*"
# zone_name = "billi.example.com"
# Uncomment and edit once the production domain exists.

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Per-environment overrides
# ---------------------------------------------------------------------------

[env.staging]
name = "billi-api-staging"
workers_dev = true            # reach via https://billi-api-staging.<subdomain>.workers.dev
# Route stanza intentionally omitted; *.workers.dev URL is enough for staging.
# Secrets are set once per env:
#   wrangler secret put CLERK_SECRET_KEY     --env staging
#   wrangler secret put TURSO_DATABASE_URL   --env staging
#   wrangler secret put TURSO_AUTH_TOKEN     --env staging
#   wrangler secret put OPENROUTER_API_KEY   --env staging

[env.production]
name = "billi-api-production"
workers_dev = false
# Production route is commented until the domain exists.
# Uncomment once billi.agenticengineering.agency (or final domain) is registered
# and the Cloudflare zone is configured (tracked in docs/ops/cloudflare-setup.md).
# [[env.production.routes]]
# pattern = "billi.example.com/api/*"
# zone_name = "billi.example.com"
