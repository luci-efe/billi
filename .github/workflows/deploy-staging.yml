# deploy-staging.yml
# Deploys the Billi API (Cloudflare Worker) and SPA (Cloudflare Pages) to
# staging on every push to the `dev` branch, and on manual dispatch.
#
# Prerequisites — set these once per repo before triggering this workflow:
#   Secrets (Settings -> Secrets and variables -> Actions -> New repository secret):
#     CF_API_TOKEN   -- Cloudflare API token (scopes: Workers Scripts Edit,
#                       Cloudflare Pages Edit, Account Settings Read)
#     CF_ACCOUNT_ID  -- 48f381bf59212dbd98d2b424ba4b9a04
#
#   Variables (Settings -> Secrets and variables -> Actions -> Variables):
#     STAGING_API_BASE_URL -- https://billi-api-staging.eduardo-lalo1999.workers.dev
#                             (baked into the SPA bundle at Vite build time).
#
# See docs/ops/cloudflare-setup.md for the full operator runbook.

name: Deploy -- Staging

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    name: Deploy Worker (staging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Shared composite handles Bun version pin + install cache + frozen install.
      - uses: ./.github/actions/setup-bun

      - name: Build API
        run: bun run --filter @billi/api build

      - name: Deploy Worker to staging
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env staging

      - name: Post Worker URL to summary
        run: |
          echo "## Deployed to" >> "$GITHUB_STEP_SUMMARY"
          echo "- **API (Worker):** https://billi-api-staging.eduardo-lalo1999.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Health check:** https://billi-api-staging.eduardo-lalo1999.workers.dev/health" >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    name: Deploy SPA (staging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-bun

      - name: Build SPA
        env:
          VITE_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_CLERK_PUBLISHABLE_KEY }}
        run: bun run --filter @billi/web build

      - name: Deploy SPA to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=billi-web-staging --branch=dev

      - name: Post Pages URL to summary
        run: |
          echo "## Deployed to" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Web (Pages, production-branch=dev):** https://billi-web-staging-6pj.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch alias:** https://dev.billi-web-staging-6pj.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Per-commit preview URL is also in the Wrangler deploy output above." >> "$GITHUB_STEP_SUMMARY"
