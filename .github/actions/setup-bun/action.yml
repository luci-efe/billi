name: Setup Bun with cache
description: Install Bun and restore bun install cache keyed on the lockfile

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        # Pin to the same Bun used locally so CI and dev behave identically.
        # Bump alongside the `packageManager` field in the root package.json.
        bun-version: 1.3.6

    - name: Restore bun install cache
      uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
      with:
        path: ~/.bun/install/cache
        # Hash both lockfile names: Bun 1.2+ writes text `bun.lock`; legacy
        # binary `bun.lockb` kept for backwards compat. hashFiles() returns a
        # hash of whichever files actually exist.
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash
